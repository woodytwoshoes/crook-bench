    necessity: essential
  heart_rate:
    finding: 96, regular.
    necessity: essential
  blood_pressure:
    finding: 128/80.
    necessity: essential
  resp_rate:
    finding: "22."
    necessity: essential
  spo2:
    finding: 95% on room air.
    necessity: essential
  general_inspection:
    finding: >-
      Flushed and tired-looking. Alert and orientated. Speaking in full
      sentences. Not cyanosed.
    necessity: essential
  chest_inspection:
    finding: >-
      Normal chest shape. Breathing slightly fast; holds back on deep breaths
      on the right.
    abnormal: true
    necessity: acceptable
  chest_expansion:
    finding: Expansion reduced on the right lower chest.
    abnormal: true
    necessity: useful
  chest_percussion:
    finding: Dull at the right base posteriorly. Resonant elsewhere.
    at:
      lungs_front: Resonant.
      lungs_back: Dull to percussion at the right base. Left base resonant.
    abnormal: [finding, lungs_back]
    necessity: essential
  chest_auscultation:
    finding: >-
      Bronchial breathing and coarse crackles at the right base posteriorly.
