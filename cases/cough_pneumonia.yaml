# Pilot case — drafted by Claude from the developer's reference texts.
# NOT clinically reviewed. Source citations are in ground_truth.notes.
id: cough_pneumonia
status: draft
title: A chest cold that won't shift
difficulty: 2
presenting_complaint: Cough and fever
condition_description: >-
  Cough and fever for a few days. Feeling pretty rotten and it's not
  shifting. Might need some antibiotics?

booked_urgent: false

patient:
  name: Mark Delaney
  age: 46
  sex: M
  occupation: High-school maths teacher
  persona:
    personality: >-
      Dry sense of humour, practical, and not one for doctors. Answers
      straightforwardly. Keen to get back to his classes before exams.
    health_literacy: medium
    emotional_state: >-
      Tired and fed up. Quietly a bit worried, because he can't remember the
      last time he felt this knocked about.
    verbosity: normal
    conceals: []
  # How he is drawn; cosmetic only, never a finding.
  appearance:
    build: average
    skin: fair
    hair: auburn
    hair_length: short
    eyes: grey
    facial_hair: beard

record:
  allergies: []
  conditions: []
  medications: []

consult_start: "08:50"

ground_truth:
  diagnosis: pneumonia
  acceptable_diagnoses: []
  sinister: false
  differentials: [acute_bronchitis, influenza, atypical_pneumonia, urti, covid19]
  sinister_diagnoses: [pulmonary_embolism, sepsis, lung_cancer, tuberculosis, pneumothorax]
  # Never recorded: the record says nil known. Found only by asking.
  allergies: [Penicillin (hives and lip swelling as a child)]
  notes: >-
    Low-severity community-acquired pneumonia (right lower lobe) in a
    previously well 46-year-old, booked as "cough and fever". Tests whether
    the player takes a focused respiratory history, measures every vital
    sign a severity score needs, finds the focal chest signs, applies a
    score (CRB-65 0, CORB 0, SMRT-CO 0), asks about allergies, and treats
    at home with an oral antibiotic he can safely take and an early review. Temperature authored at 38.0
    to sidestep Murtagh's ">38" admission criterion; age under 65 so CRB-65
    is unambiguously 0; a hidden immediate penicillin allergy (hives,
    lip swelling), not on the record, so amoxicillin is out and the player
    must ask: doxycycline alone for mild pneumonia [em p.349 L15922; murtagh
    p.966 L15703, dose from L15699], moxifloxacin alone if immediate
    penicillin hypersensitivity [em p.349 L15932], macrolide alone for mild
    pneumonia [em p.349 L15922]. DRAFT re-key, 2026-09-29. sinister: false because low-severity CAP
    is not itself a can't-miss diagnosis; severe pneumonia/sepsis, PE, lung
    cancer, TB and pneumothorax are the can't-miss alternatives. Sources:
    definition and community management [em p.342 L.15453, L.15466; em
    p.343 L.15488]; S. pneumoniae commonest [em p.342 L.15458; murtagh
    p.962 L.15667]; presenting symptoms [em p.343 L.15484; murtagh p.962-963
    L.15670-15674; talley p.217 L.9724; talley p.194 L.8917-8918]; rusty
    sputum [murtagh p.950 L.15469]; red flags and admission criteria
    [murtagh p.966 L.15714; murtagh p.965 L.15703; em p.348 L.15717]; CORB
    [em p.348 L.15695-15698; em p.517 L.23718]; CURB-65/CRB-65 [em p.348
    L.15707-15711]; SMART-COP/SMRT-CO [em p.347 L.15626-15680; em p.348
    L.15688-15693]; immunosuppression excludes CAP [em p.343 L.15488];
    comorbidity, smoking, exposures and their weak associations [em p.347
    L.15671; murtagh p.946 L.15417, L.15431; em p.344 L.15539; em p.345
    L.15545]; post-influenza S. aureus [em p.343 L.15496]; PE vs pneumonia
    [talley p.194 L.8913-8915; murtagh p.946 L.15431]; weight loss/TB
    [murtagh p.944 L.15393; p.945 L.15404]; vitals and chest signs, LRs
    [talley p.217 L.9661-9727; talley p.218 L.9731; talley p.212 L.9442;
    talley p.213 L.9470]; calves [murtagh p.956 L.15566]; CXR [em p.345
    L.15564; talley p.226 L.10133; murtagh p.945 L.15406]; routine bloods,
    cultures, CRP, sputum of little value in non-severe CAP [em p.345
    L.15575; em p.346 L.15587-15608]; amoxicillin 1 g 8-hourly usually 5
    days, review and follow-up plan, doxycycline add-on criteria [abx p.2
    L.66-83, TG May 2025]; 5-7 days and doxycycline for atypicals [murtagh
    p.964 L.15699]; review in 24-48 h, rest, analgesia, fluids [em p.348
    L.15725]; phenoxymethylpenicillin inadequate, broad-spectrum and
    fluoroquinolone overuse, cefuroxime as alternative [em p.350
    L.15926-15933]; no antibiotic for bronchitis but needed for pneumonia
    [murtagh p.961 L.15652-15654; em p.347 L.15620]; steroids no outcome
    benefit [em p.351 L.15962]; complications [murtagh p.963 L.15680];
    mortality [em p.342 L.15478; em p.349 L.15889-15891]. CXR essential
    (developer's decision, 2026-10-01) [em p.345 L.15564; talley p.226
    L.10133; murtagh p.963 L.15678]. Not in sources (see questions):
    sputum/viral PCR turnaround, sputum
    sensitivities, safety-net wording, hospital referral scoring, cefuroxime
    and doxycycline/macrolide monotherapy scoring.

