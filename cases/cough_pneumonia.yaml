investigations:
  # Matches the authored heart rate: the catalogue normal says 72/min
  # (playtest, 2026-10-01).
  # 2026-10-03 (developer's decision, Heidi full key check): neutral, not -2;
  # pleuritic pain and breathlessness keep PE in view (Respiratory Medicine Today, BMJ Best Practice).
  ecg_12_lead:
    result: Sinus rhythm 96/min. Normal axis and intervals. No ST or T-wave changes.
    turnaround_days: 0
    necessity: acceptable
  # Useful (developer's decision, 2026-10-03; essential from 2026-10-01): a
  # new infiltrate is central to the diagnosis [em p.345 L15564; talley p.226
  # L10133; murtagh p.963 L15678], and a single lobe is what keeps him at home
  # [murtagh p.966 L15714], but most community CAP needs no X-ray; reasonable
  # if CRB-65 > 0 (Respiratory Medicine Today 2024, via Heidi Evidence,
  # docs/review/heidi/answers.md).
  chest_xray:
    abnormal: true
    result: >-
      Right lower lobe consolidation with air bronchograms. Other lobes
      clear. No pleural effusion. Normal heart size.
    turnaround_days: 0
    necessity: useful
  sputum_mcs:
    abnormal: true
    result: >-
      Gram stain: numerous neutrophils, Gram-positive diplococci. Culture:
      Streptococcus pneumoniae.
    turnaround_days: 2
    necessity: acceptable
  resp_viral_pcr:
    result: Influenza A and B, RSV and SARS-CoV-2 not detected.
    turnaround_days: 1
    necessity: acceptable
  crp:
    abnormal: true
    result: CRP 142 mg/L.
    necessity: acceptable
  # 2026-10-03 (developer's decision, Heidi full key check): neutral, not -2;
  # severity and baseline (MJA, Respiratory Medicine Today).
  fbe:
    abnormal: true
    result: Hb 148 g/L, WCC 14.6 (neutrophils 12.1), platelets 310.
    necessity: acceptable
  # 2026-10-03 (developer's decision, Heidi full key check): neutral, not -2;
  # severity and baseline (MJA, Respiratory Medicine Today).
  uec:
    result: Na 138, K 4.2, urea 5.1, creatinine 84, eGFR >90.
    necessity: acceptable
  lft:
    result: Normal.
    necessity: unnecessary
  blood_culture:
    result: No growth at 48 hours.
    necessity: unnecessary

management:
  # Items with `when` are matched to game actions by code. Plain strings can
  # only be said: the judge looks for them in the closing explanation.
  # Referring this score-0 patient to hospital is deliberately unscored.
  ideal:
    # Penicillin allergy (hidden): amoxicillin is penalised by the safety rules.
    - text: Doxycycline 100 mg orally 12-hourly for 5–7 days (penicillin allergy)
      when:
        prescribe: [doxycycline]
        frequency: [Twice daily, Every 12 hours]
        duration: [5 days, 7 days]
    - Explain it is pneumonia that is safe to treat at home
    - Review in 24 to 48 hours (e.g. "come back and see me in two days")
    - Safety-net — come back urgently if more breathless, confused, or unable to keep tablets down
  acceptable:
    - text: Moxifloxacin alone (immediate penicillin hypersensitivity)
      when: { prescribe: [moxifloxacin] }
    - text: A macrolide alone for mild pneumonia
      when: { prescribe: [roxithromycin, clarithromycin, azithromycin] }
    - text: Paracetamol for fever and chest pain
      when: { medicate: [paracetamol] }
      also_said: true
    - Drink plenty of fluids
    # 2026-10-03 (developer's decision, Heidi full key check): the allergy is
    # hidden, so recording it protects him next time (SA Health, MJA).
    - Add the penicillin allergy to his record
    # 2026-10-03 (developer's decision, Heidi full key check): about 10% fail
    # community treatment (BMJ Best Practice).
    - Come back if not improving in 48 to 72 hours
  harmful:
    - text: Phenoxymethylpenicillin
      when: { medicate: [phenoxymethylpenicillin] }
      consequence: >-
        Oral penicillin is too poorly absorbed to cover the pneumococcus
        reliably. Mark is no better at two days and needs his antibiotic
        changed.
    - text: Ciprofloxacin or norfloxacin (reserve antibiotics)
      when: { medicate: [ciprofloxacin, norfloxacin] }
      consequence: >-
        A reserve antibiotic is used for a low-severity pneumonia. The
        prescription is flagged at the practice's antimicrobial stewardship
        audit.
    - text: Broad-spectrum antibiotic first-line
      when: { medicate: [amoxicillin + clavulanic acid, ceftriaxone] }
      consequence: >-
        Mark's chest settles, but the broad-spectrum antibiotic brings on
        severe diarrhoea — Clostridioides difficile — and the prescription is
        flagged at the stewardship audit.
    - text: Tell him it's viral and send him home without an antibiotic (e.g. "it's just a virus", "it's only a chest cold, ride it out")
      consequence: >-
        Mark goes home without antibiotics. Two days later he is breathless
        at rest and is brought to hospital with a parapneumonic effusion.
    # Drafted from the references, not yet reviewed (see docs/research).
    # Metronidazole's antibacterial activity is confined to anaerobes (and protozoa) [em p.522 L24097–24099]; the pathogens of community-acquired pneumonia are S. pneumoniae and the atypicals, treated with a beta-lactam, macrolide or tetracycline [em p.350 L15922–15929; murtagh p.962 L15665, p.964 L15699]. Tinidazole is the same class (formulary). Leaving pneumonia effectively untreated mirrors the existing "it's viral, no antibiotic" harm.
    - text: Metronidazole or tinidazole as the antibiotic for pneumonia
      when: { medicate: [metronidazole, tinidazole] }
      consequence: >-
        The metronidazole does nothing against the pneumococcus in Mark's
        lung. Two days later he is breathless at rest and is admitted to
        hospital with the pneumonia still spreading.
    # Norfloxacin is one of the "important quinolones" to keep off first-line use, and is kept for proven-resistant urinary infection [murtagh p.398 L6851–6855]; early quinolones act mainly on gram-negative bacilli [em p.523 L24146]; quinolone use in mild pneumonia raises concern about resistance to reserve agents such as ciprofloxacin [em p.350 L15925], and focused quinolone use is advised [em p.523 L24123–24142]. Amoxicillin is first-line [abx p.2 L46–47; murtagh p.964 L15699]. The existing fluoroquinolone item lists only ciprofloxacin and moxifloxacin.
    - text: Antibiotic course of a month or longer for pneumonia
      when:
        medicate:
          - amoxicillin
          - doxycycline
          - cefuroxime
          - clarithromycin
          - roxithromycin
          - azithromycin
        duration: [1 month, 3 months, Ongoing]
      consequence: >-
        Mark keeps taking antibiotics for weeks after his chest has cleared,
        until the diarrhoea starts: Clostridioides difficile. The script is
        flagged at the stewardship audit.
  # Oral steroids moved here from harmful (2026-10-03, developer's decision): no
  # benefit in low-severity CAP, but no evidence of net harm in that group either
  # (Cochrane, Stern 2017, via Heidi Evidence, docs/review/heidi/answers.md).
  not_indicated: [prednisolone, dexamethasone]

consequences:
  ideal: >-
    Mark comes back two days later with his fever gone and the chest pain
    easing. He finishes his course of doxycycline and is back in the classroom
    the following week.
  acceptable: Mark recovers at home.
  harmful: >-
    The treatment didn't match a low-severity pneumonia. Mark's recovery is
    slower than it should have been, and the prescription is flagged at the
    stewardship audit.
  missed_red_flag: >-
    Without a proper severity assessment, the plan rested on guesswork. Mark
    deteriorates at home and is admitted with severe pneumonia — a turn that
    should have been anticipated, or at least safety-netted, at the first
    visit.
