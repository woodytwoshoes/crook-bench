# Pilot case — drafted by Claude from the developer's reference texts.
# NOT clinically reviewed. Source citations are in ground_truth.notes.
id: chest_pain_stemi
status: draft
title: Just a bit of indigestion
difficulty: 2
presenting_complaint: Indigestion
condition_description: >-
  Indigestion since this morning. Wife insisted I get it looked at.

# Graham didn't think it was urgent: booking triage can mislead.
booked_urgent: false

patient:
  name: Graham Mitchell
  age: 58
  sex: M
  occupation: Plumber, self-employed
  persona:
    personality: >-
      Stoic, laconic, dislikes fuss. Only came because his wife insisted.
      Keeps calling it indigestion and wants antacids so he can get to a job.
    health_literacy: low
    emotional_state: >-
      Uneasy and quietly frightened underneath the bravado.
    verbosity: terse
    conceals:
      # Topic only: the actor sees this from the first turn, so naming the
      # tablet here leaked it. The fact itself is history item pde5_inhibitor.
      - His sex life; embarrassed, says as little as he can
  # How he is drawn; cosmetic only, never a finding.
  appearance:
    build: average
    skin: fair
    hair: grey
    hair_length: short
    eyes: blue
    facial_hair: none

record:
  allergies: []
  conditions:
    - Hypertension
    - Hypercholesterolaemia
    - Current smoker
  medications:
    - Perindopril 5 mg daily
    - Atorvastatin 40 mg daily

# Troponin and other timed results show this as their collection time.
consult_start: "08:30"

ground_truth:
  # Diagnosis keys are ids from catalogue/diagnoses.yaml.
  diagnosis: stemi
  acceptable_diagnoses: [acs, myocardial_infarction]
  # The key diagnosis is itself can't-miss.
  sinister: true
  differentials: [unstable_angina, pericarditis, gord, oesophageal_spasm, msk_chest_pain]
  sinister_diagnoses: [aortic_dissection, pulmonary_embolism, pneumothorax]
  # Takes, not on the record: checked by the global safety rules.
  taking: [sildenafil]
  notes: >-
    Danger case: recognise ACS behind "indigestion", get the ECG, transfer by
    ambulance with aspirin, and withhold GTN because of recent sildenafil.
    Sources: STEMI chosen because ECG alone selects for reperfusion
    [murtagh p.900]; mistaking ischaemia for indigestion is the commonest
    serious error [murtagh p.893, p.1070-1072; em p.242]; pain >15-20 min
    suggests infarction [murtagh p.862, p.871]; red-flag associated symptoms
    [murtagh p.862]; crescendo pattern [murtagh p.860, p.883; talley p.88];
    dissection features [murtagh p.871; em p.314-316; talley p.86, p.148];
    inferior MI bradycardia/hypotension [talley p.147]; ECG within 10 min,
    STEMI criteria [em p.251]; early troponin non-informative, up to 10 h to
    be reliably negative [murtagh p.898; em p.246]; do not wait for bloods
    [talley p.185]; aspirin 300 mg, not contraindicated by indigestion
    [murtagh p.899-900; em p.251-252]; GTN 300 mcg SL unless BP <90 or pulse
    <50, avoid within 24 h of sildenafil [murtagh p.888, p.900, p.3160];
    oxygen only if SpO2 <94% [em p.247, p.252; murtagh p.898, p.900];
    morphine titrated IV [murtagh p.900, p.3160]; ambulance/MICA and phone
    ahead [murtagh p.898-900, p.3160]; GTN/antacid response not diagnostic
    [em p.247]. Developer's decisions, 2026-10-01: point-of-care troponin
    useful (first essential, changed once the sources were read: the ECG
    alone decides transfer); formal bloods (troponin, CK, FBE, UEC, LFT, coags, lipids,
    HbA1c) acceptable, drawn with the IV line [murtagh p.900] and never
    awaited; IV opioid acceptable rather than ideal (severe pain [em
    p.252]; "reasonable", slows oral P2Y12 inhibitors: NHFA/CSANZ ACS
    guideline 2025, https://assets.contentstack.io/v3/assets/blt8a393bb3b76c0ede/blt8874388e6d9b835c/ACS-Abridged-Guidelines.pdf);
    aspirin-allergy question incidental, not scored (rare; benefit judged
    to outweigh risk in AMI. Sources: known allergy is the principal
    contraindication [em p.252]; the guideline advises risk assessment and
    desensitisation in aspirin sensitivity). Not in sources (standard
    teaching, for developer review): reciprocal ST depression in I/aVL;
    "000"; driving self to hospital as harmful.

history:
  - id: pain_character
    topic: What the pain or discomfort feels like
    answer: >-
      It's like a heaviness. Like indigestion but… heavier. Sort of a weight
      sitting on my chest.
    volunteered: true
    importance: essential
  - id: pain_site
    topic: Where exactly the discomfort is
    answer: Right in the middle, behind the breastbone. Bit up into the throat.
    volunteered: false
    open_question: true
    importance: essential
  - id: pain_radiation
    topic: Whether the discomfort spreads or travels anywhere (arms, jaw, neck, back)
    answer: >-
      Now you mention it, my jaw's a bit achy, and my left arm feels heavy.
      Not my back.
    volunteered: false
    open_question: true
    importance: essential
  - id: onset_time
    topic: When the discomfort started
    answer: >-
      About seven this morning. Came on over a few minutes.
    volunteered: false
    open_question: true
    importance: essential
  - id: onset_activity
    # Topics reworded after playtest misroutes (2026-10-01): "exerting" here
    # pulled exertion questions away from crescendo_angina.
    topic: Activity at the moment today's pain began
    answer: >-
      I was just sitting having a cuppa, reading the paper.
    volunteered: false
    importance: essential
  - id: duration_ongoing
    topic: How long it has lasted and whether it is still present now
    answer: >-
      It's been going the whole time — so an hour and a half, near enough.
      Still there now.
    # Obvious to the patient: he is sitting there with it.
    volunteered: true
    importance: red_flag
  # covers (decoys.ts): the generic decoys an item is this case's version of.
  # If the decoy wins a question, nothing is scored, and for a present fact
  # the patient denies it ("never had chest pain before").
  - id: sweating
    topic: Sweating or clamminess with the pain
    answer: Yeah, I've been sweating like anything. Thought it was just hot.
    volunteered: false
    importance: red_flag
    covers: [other_sweats]
  - id: dyspnoea
    topic: Shortness of breath
    answer: A bit short of breath, yeah. Hard to get a proper breath in.
    volunteered: false
    importance: red_flag
    covers: [other_breathing]
  - id: presyncope
    topic: Dizziness, light-headedness or fainting
    answer: Bit light-headed getting out of the car. Didn't pass out.
    volunteered: false
    importance: red_flag
  - id: crescendo_angina
    topic: Had this chest pain before, e.g. on stairs or exertion
    answer: >-
      This past week I've had a bit of a tightness going up ladders — goes
      away if I stop. Put it down to being unfit. It's been happening more.
    volunteered: false
    importance: red_flag
    covers: [other_previous]
  - id: nausea_vomiting
    topic: Nausea or vomiting
    answer: Feel a bit sick. Haven't vomited.
    volunteered: false
    # An associated symptom: the GP has to ask about it specifically.
    importance: essential
  - id: tearing_pain
    topic: Sudden severe tearing or ripping pain
    answer: >-
      No, nothing like that. It crept up on me.
    volunteered: false
    # Pain through to the back is covered by pain_radiation.
    importance: red_flag
    absent: true
  - id: neuro_symptoms
    topic: Weakness, numbness or other neurological symptoms, or limb pain
    answer: No. Arm's heavy but I can use it fine.
    volunteered: false
    importance: red_flag
    covers: [other_numbness]
    absent: true
  - id: pde5_inhibitor
    # A broad probe beyond his regular tablets counts (developer's decision,
    # 2026-10-01); a bare "any medications?" lands on the regular-medicines
    # decoy. "Taking" keeps allergy questions off it.
    topic: Taking any other medicines or tablets, beyond the regular ones (e.g. occasional, from the chemist, a friend or online)
    answer: >-
      …Yeah. Took one of those Viagra tablets last night. Don't tell the missus
      I told you.
    volunteered: false
    importance: red_flag
  - id: aspirin_allergy
    # Every medicine allergy, so "any allergies to medicines?" lands here
    # rather than on the occasional-medicines item (the generic allergy
    # decoy is covered).
    topic: Allergies to any medicine, including aspirin
    answer: No allergies that I know of. I've had Disprin before, no problems.
    volunteered: false
    # Incidental, not a red flag (developer's decision, 2026-10-01): true
    # aspirin allergy is rare, and in AMI aspirin's benefit is judged to
    # outweigh the risk. Kept so "any allergies?" still lands here and he
    # gives his own answer. Not scored.
    importance: incidental
    covers: [other_allergies]
    absent: true
  - id: previous_cardiac
    topic: Previous heart problems, angina, stents or heart operations
    answer: Never had anything wrong with my heart.
    volunteered: false
    importance: essential
    absent: true
  - id: smoking
    topic: Smoking history
    answer: About twenty a day since I was a teenager. Been meaning to quit.
    volunteered: false
    importance: essential
    covers: [other_smoking]
  - id: diabetes
    topic: Diabetes
    answer: Not that I know of.
    volunteered: false
    importance: essential
    absent: true
  - id: anticoagulants
    topic: Blood thinners (anticoagulants)
    answer: >-
      No, nothing like that.
    volunteered: false
    importance: essential
    absent: true
  # 2026-10-03 (developer's decision, Heidi full key check): aspirin or another
  # antiplatelet already taken changes the loading decision (BMJ Best Practice,
  # ANZCOR, NHF/CSANZ 2025). Separate from blood thinners and allergies above.
  - id: antiplatelet
    topic: Already taking aspirin or clopidogrel
    answer: No, I don't take aspirin or anything like that.
    volunteered: false
    importance: essential
    absent: true
  - id: recent_bleeding
    topic: Any recent bleeding
    answer: >-
      No.
    volunteered: false
    importance: supporting
    absent: true
  - id: previous_stroke
    # Reworded (eval:sweep, 2026-10-03): after the antiplatelet item was added,
    # "Any previous stroke" also took "Have you had any operations?", so the
    # patient denied a stroke when asked about surgery. With this wording the
    # old and new keys release the same, interleaved 3 times.
    topic: Ever had a stroke or mini-stroke
    answer: >-
      No, never.
    volunteered: false
    importance: supporting
    absent: true
  - id: recent_surgery
    topic: Any recent surgery
    answer: >-
      No operations.
    volunteered: false
    importance: supporting
    covers: [other_operations]
    absent: true
  - id: family_history
    topic: Family history of heart disease at a young age
    answer: Dad had a heart attack at fifty-five. He died from it.
    volunteered: false
    importance: supporting
    covers: [other_family]
  - id: pleuritic_pain
    topic: Whether the pain is worse on breathing in
    answer: >-
      No, breathing doesn't change it.
    volunteered: false
    importance: supporting
    absent: true
  - id: positional_pain
    topic: Whether the pain changes lying flat or sitting forward
    answer: >-
      No, it's the same however I sit.
    volunteered: false
    importance: supporting
    absent: true
  - id: movement_pain
    topic: Whether moving or pressing on the chest makes it worse
    answer: >-
      No, moving doesn't change it.
    volunteered: false
    importance: supporting
    absent: true
    # "Does anything make it better or worse? Like moving, breathing in,
    # eating..." went to the generic decoy, not his five items (multi-agent
    # playtest, 2026-10-01).
    covers: [other_relief]
  - id: heartburn_history
    topic: Previous heartburn or reflux
    answer: >-
      I get a bit of heartburn after a big feed sometimes. This isn't like that really.
    volunteered: false
    importance: supporting
  - id: meal_relation
    topic: Whether the pain is related to meals
    answer: >-
      No, I didn't eat much. It wasn't after food.
    volunteered: false
    importance: supporting
    absent: true
  - id: acid_regurgitation
    topic: Acid taste or regurgitation
    answer: >-
      No, no acid coming up.
    volunteered: false
    importance: supporting
    absent: true
  - id: antacid_response
    topic: Whether antacids or anything else relieved it
    answer: Had a couple of Quick-Eze. Didn't touch it.
    volunteered: false
    importance: supporting
    covers: [other_treatment_tried]
  - id: leg_swelling
    topic: Leg swelling or calf pain
    answer: >-
      No, legs are fine.
    volunteered: false
    importance: supporting
    covers: [other_swelling]
    absent: true
  - id: immobility_travel
    topic: Long trips or bed rest recently
    answer: >-
