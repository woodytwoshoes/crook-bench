    necessity: unnecessary

investigations:
  # Matches the authored heart rate: the catalogue normal says 72/min
  # (playtest, 2026-10-01). Unnecessary, as an unlisted test scores.
  ecg_12_lead:
    result: Sinus rhythm 78/min. Normal axis and intervals. No ST or T-wave changes.
    turnaround_days: 0
    necessity: unnecessary
  urine_dipstick:
    abnormal: true
    result: Leucocytes ++, nitrites positive, blood trace, protein trace. hCG not tested.
    turnaround_days: 0
    necessity: essential
  urine_pregnancy_test:
    result: Negative.
    turnaround_days: 0
    necessity: useful
  urine_mcs:
    abnormal: true
    result: >-
      Microscopy: leucocytes >100 ×10⁶/L. Culture: E. coli >10⁸ cfu/L,
