examination:
  temperature:
    finding: 36.8 °C.
    necessity: essential
  heart_rate:
    finding: 78, regular.
    necessity: essential
  blood_pressure:
    finding: 118/72.
    necessity: useful
  general_inspection:
    finding: Looks well. Not unwell or toxic.
    necessity: useful
  # Authored so general palpation agrees with the suprapubic finding: the
  # catalogue normal said "non-tender" (playtest round 3). Palpation
  # focuses on the loins and suprapubic area [murtagh p.1856 L30443].
  abdominal_palpation:
    finding: >-
      Soft. Mild suprapubic tenderness; non-tender elsewhere. No masses or
      organomegaly.
    abnormal: true
    necessity: acceptable
  abdominal_suprapubic:
    finding: >-
      Soft abdomen. Mild suprapubic tenderness. No guarding or rebound. No
      masses.
    abnormal: true
    necessity: essential
  renal_angle:
    finding: No renal angle tenderness on either side.
    necessity: essential
  pelvic_speculum:
    finding: Normal vulva and vagina; no discharge; cervix normal.
    necessity: unnecessary
  rectal:
