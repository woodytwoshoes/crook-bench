# Pilot case — drafted by Claude from the developer's reference texts.
# NOT clinically reviewed. Source citations are in ground_truth.notes.
id: dysuria_cystitis
status: draft
title: Stinging when I wee
difficulty: 1
presenting_complaint: Burning when passing urine
condition_description: >-
  Burning when I wee since yesterday. Pretty sure it's a UTI again. Need antibiotics please.

booked_urgent: true

patient:
  name: Chloe Nguyen
  age: 22
  sex: F
  occupation: Hospitality worker (café barista), studying part-time
  persona:
    personality: >-
      Friendly and practical. Fairly sure she knows what this is and wants to
      get a script and get back to work. A little embarrassed talking about
      sex, but answers honestly if asked plainly.
    health_literacy: medium
    emotional_state: Uncomfortable and mildly impatient; not worried.
    verbosity: normal
    conceals:
      - Her sex life, until asked directly (then answers honestly)
  # How she is drawn; cosmetic only, never a finding.
  appearance:
    build: slim
    skin: light
    hair: black
    hair_length: long
    eyes: brown

record:
  allergies: []
  conditions: []
  medications:
    - Combined oral contraceptive pill (levonorgestrel/ethinylestradiol)

# Troponin and other timed results show this as their collection time.
consult_start: "10:15"

ground_truth:
  # Diagnosis keys are ids from catalogue/diagnoses.yaml.
  diagnosis: cystitis
  acceptable_diagnoses: [uti, lower_uti]
  sinister: false
  differentials: [sti_urethritis, chlamydia, vaginal_candidiasis, bacterial_vaginosis, complicated_uti]
  sinister_diagnoses: [pyelonephritis, pid, ectopic_pregnancy, appendicitis]
  notes: >-
    Routine case testing efficiency: quick exclusion of pyelonephritis,
    pregnancy, STI and vaginitis; dipstick; a first-line short course.
    Sources: presentation and precipitants [murtagh p.388-391, p.404,
    p.1854-1856]; dysuria without discharge ~90% cystitis [em p.484];
    pyelonephritis features [murtagh p.391; em p.484; talley p.325];
    dipstick-guided empirical treatment, culture not mandatory [murtagh p.393,
    p.395, p.404; em p.485]; imaging unnecessary [em p.485; murtagh p.404];
    first line is any one of nitrofurantoin 100 mg 6-hourly 5 days,
    fosfomycin 3 g single dose or trimethoprim 300 mg daily 3 days, with
    cefalexin 500 mg 12-hourly 5 days only if none of these can be used
    (eTG, developer's excerpt 2026-10-01); nitrofurantoin also [abx p.3
    L65-67]; trimethoprim and cefalexin also [murtagh p.398 L6833-6837; em
    p.485 L22096-22097]; consider an alternative to trimethoprim if used in
    the last 3 months [em p.485 L22093]; fosfomycin product [TGA ARTG
    411811, https://www.tga.gov.au/resources/artg/411811];
    fluoroquinolone/amoxicillin first-line inappropriate
    [abx p.3; murtagh p.398; em p.485]; no alkaliniser with nitrofurantoin
    [murtagh p.396]; chlamydia screening in young sexually active women
    [redbook p.156, p.160]. Age 22 chosen so the Red Book screening age
    threshold applies whichever way the extracted symbol reads.

history:
  - id: dysuria_character
    topic: What the pain on passing urine is like and when in the stream it occurs
    answer: >-
      It stings and burns, worst right at the end of weeing. Like my last UTI.
    volunteered: true
    importance: essential
    covers: [other_urine]
  - id: frequency_urgency
    topic: How often and how urgently she needs to pass urine
    answer: >-
      I'm going constantly — every half hour — and only a little bit comes
      out. I have to rush.
    volunteered: true
    importance: essential
  - id: duration
    topic: How long the symptoms have been present
    answer: Since yesterday morning, so about a day and a half.
    volunteered: false
    open_question: true
    importance: essential
  - id: fever_rigors
    topic: Fever, sweats, chills or shaking
    answer: No, no fevers or shivers. I feel fine apart from this.
    volunteered: false
    importance: red_flag
    covers: [other_sweats]
    absent: true
  - id: loin_pain
    topic: Pain in the back or sides (loins)
    answer: No, nothing in my back. Just a bit of an ache low down in my tummy.
    volunteered: false
    importance: red_flag
    absent: true
  - id: nausea_vomiting
    topic: Nausea, vomiting or feeling generally unwell
    answer: No, I'm eating normally. Haven't been sick.
    volunteered: false
    importance: red_flag
    absent: true
  - id: pregnancy_possible
    topic: Whether she could be pregnant
    answer: >-
      No, I don't think so.
    volunteered: false
    importance: red_flag
    absent: true
  - id: last_period
    topic: When her last period was
    answer: >-
      About two weeks ago. It was normal.
    volunteered: false
    importance: essential
  - id: contraception
    topic: Contraception
    answer: >-
      I'm on the pill and I don't miss it.
    volunteered: false
    importance: essential
  - id: abdominal_pain
    topic: Abdominal pain beyond a low ache
    answer: >-
      Just the low ache above my bladder. Nothing else.
    volunteered: false
    importance: red_flag
    absent: true
  - id: abnormal_bleeding
    topic: Any unusual vaginal bleeding
    answer: >-
      No, just my normal periods.
    volunteered: false
    importance: red_flag
    absent: true
  # 2026-10-03 (developer's decision, Heidi full key check): screens for
  # cervicitis or PID, distinct from "unusual bleeding" (EAU, AJGP, BMJ Best Practice).
  - id: postcoital_intermenstrual_bleeding
    topic: Bleeding after sex or between periods
    answer: Um, no. Never after sex, and nothing between my periods.
    volunteered: false
    importance: essential
    absent: true
  - id: vaginal_discharge_itch
    topic: Vaginal discharge, itch or irritation
    answer: No, nothing like that.
    volunteered: false
    importance: essential
    absent: true
  - id: sexual_partners
    topic: Sexual activity and partners
    answer: >-
      Um — yeah, I have a boyfriend. We've been together about a year. Just him.
    volunteered: false
    importance: essential
  - id: condom_use
    topic: Condom use
    answer: >-
      We don't use condoms because I'm on the pill.
    volunteered: false
    importance: essential
  - id: haematuria
    topic: Colour of the urine or any visible blood
    answer: It's a bit cloudy and smells, but I haven't seen any blood.
    volunteered: false
    open_question: true
    importance: essential
  - id: previous_utis
    topic: Previous urine infections
    answer: >-
      I had one UTI about two years ago, that's it.
    volunteered: false
    importance: essential
    covers: [other_previous]
  - id: renal_tract_problems
    topic: Known kidney or bladder problems
    answer: >-
