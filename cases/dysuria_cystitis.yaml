management:
  # Items with `when` are matched to game actions by code. Plain strings can
  # only be said: the judge looks for them in the closing explanation.
  ideal:
    # First line is any one of three regimens (eTG, developer's excerpt,
    # 2026-10-01): one item with three alternatives, not three items, since
    # the case maximum counts every ideal item and one script is the job.
    - text: >-
        First-line antibiotic: nitrofurantoin 100 mg 6-hourly for 5 days,
        fosfomycin 3 g once, or trimethoprim 300 mg daily for 3 days
      when:
        - prescribe: [nitrofurantoin]
          frequency: [Four times daily, Every 6 hours]
          duration: [5 days]
        # A single dose: scripted, or given in the room.
        - medicate: [fosfomycin]
          frequency: [Once only, Stat dose]
          duration: [Single dose]
        - prescribe: [trimethoprim]
          frequency: [Once daily, In the morning, At night]
          duration: [3 days]
    - Advise plenty of fluids
    - Paracetamol for discomfort
    - Safety-net — return if fever, loin pain, vomiting, or not improving within 48 hours
  acceptable:
    # Second line: only if none of the first-line choices can be used (eTG,
    # developer's excerpt, 2026-10-01).
    - text: Cefalexin 500 mg orally 12-hourly for 5 days (second line)
      when: { prescribe: [cefalexin], duration: [5 days] }
    - text: Urinary alkaliniser with trimethoprim
      when: { medicate: [sodium citrotartrate], with: [trimethoprim] }
    # 2026-10-03 (developer's decision, Heidi full key check): a counselling
    # point, so acceptable rather than ideal (BMJ Best Practice, PSA).
    - Take the nitrofurantoin with food
  harmful:
    - text: A fluoroquinolone (ciprofloxacin, norfloxacin, moxifloxacin) first-line
      when: { medicate: [ciprofloxacin, norfloxacin, moxifloxacin] }
      consequence: >-
        Chloe's infection clears, but the quinolone is flagged at the
        practice's antimicrobial stewardship audit, and she develops Achilles
        pain a week later.
    - text: Amoxicillin alone
      when: { medicate: [amoxicillin] }
      consequence: >-
        Chloe re-presents three days later no better: the E. coli was
        amoxicillin-resistant.
    # 7 days taken out (2026-10-03, developer's decision): AUA treats 7 days as the
    # upper acceptable limit, longer than needed but not clearly harmful (via Heidi
    # Evidence, docs/review/heidi/answers.md, cystitis message 1). 10+ days stays.
    - text: Antibiotic course of 10 days or more for uncomplicated cystitis
      when:
        medicate:
          - nitrofurantoin
          - fosfomycin
          - trimethoprim
          - cefalexin
          - amoxicillin + clavulanic acid
          - amoxicillin
          - ciprofloxacin
          - norfloxacin
          - trimethoprim + sulfamethoxazole
        duration: [10 days, 14 days, 1 month, 3 months, Ongoing]
      consequence: >-
        The infection settles, but the long course brings thrush and diarrhoea,
        and the prescription is flagged at the stewardship audit.
    - text: Nitrofurantoin combined with a urinary alkaliniser
      when: { medicate: [nitrofurantoin], with: [sodium citrotartrate] }
      consequence: >-
        The alkaliniser blunts the nitrofurantoin. Chloe's symptoms drag on and
        she re-presents for a second course.

  # Amoxicillin-clavulanate is not indicated (developer's decision,
  # 2026-10-01): the eTG excerpt names cefalexin as the only fallback, so a
  # broad-spectrum course where narrow first-line ones exist costs as an
  # unlisted drug; ten days or more is still the long-course harm.
  # Ceftriaxone appears in the sources for UTI only as IV therapy for severe pyelonephritis in penicillin hypersensitivity [em p.486 L22124]; uncomplicated cystitis is treated with oral nitrofurantoin, trimethoprim, cefalexin or amoxicillin-clavulanate [abx p.3 L80; murtagh p.398 L6833–6849]; overprescribing broad-spectrum antibiotics brings C. difficile, anaphylaxis and resistance [em p.350 L15929, p.350 L15933–15941].
  # Ceftriaxone moved here from harmful (2026-10-03, developer's decision): parenteral
  # treatment is for complicated or severe infection only; a stewardship error rather
  # than a harm (BMJ Best Practice, via Heidi Evidence, answers.md, cystitis).
  # Narrow penicillins moved here from harmful (2026-10-03, developer's decision): no
  # E. coli activity, but a third of cystitis self-resolves; amoxicillin alone stays
  # harmful as the common real error (EAU; BMJ; via Heidi Evidence, docs/review/heidi/answers.md).
  # Co-trimoxazole moved here from harmful (2026-10-03, developer's decision, Heidi
  # full key check): stewardship, not dangerous; first line overseas, Australia uses
  # trimethoprim alone (IDSA, EAU, via BMJ Best Practice). 10+ days stays the long-course harm.
  not_indicated: [amoxicillin + clavulanic acid, ceftriaxone, flucloxacillin, dicloxacillin, phenoxymethylpenicillin, benzylpenicillin, trimethoprim + sulfamethoxazole]

consequences:
  ideal: >-
    Chloe texts the clinic two days later to say she's back to normal. No
    follow-up needed.
  acceptable: Symptoms settle over a few days and Chloe doesn't need to come back.
  harmful: >-
    Chloe re-presents. The treatment was inappropriate for uncomplicated
    cystitis, and the prescription is flagged at the stewardship audit.
  missed_red_flag: >-
    Chloe re-presents two days later with fever, loin pain and vomiting — or
    the diagnosis is revised to something that was never excluded. She needs
    escalation that could have been anticipated at the first visit.
