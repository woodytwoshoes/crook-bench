  # Ask about allergies before any antimicrobial, record or not (ACSQHC
  # Antimicrobial Stewardship Clinical Care Standard 2020, quality statement
  # 3). Playtest, 2026-10-01: without this item "Are you allergic to any
  # antibiotics?" released recent antibiotics and got "No antibiotics this
  # year".
  - id: antibiotic_allergy
    topic: Allergy to antibiotics
    answer: No, I'm not allergic to anything that I know of.
    volunteered: false
    importance: essential
    covers: [other_allergies]
    absent: true
  - id: overseas_travel
