examination:
  temperature:
    finding: 37.9 °C.
    necessity: essential
  heart_rate:
    finding: 102, regular.
    necessity: essential
  blood_pressure:
    finding: 126/78.
    necessity: useful
  resp_rate:
    finding: "16."
    necessity: useful
  general_inspection:
    finding: >-
      Flushed and uncomfortable. Lies very still on the couch and walks in
      slightly stooped.
    necessity: useful
  throat:
    finding: Tongue coated; mild halitosis.
    abnormal: true
    necessity: acceptable
  abdominal_inspection:
    finding: Flat. No scars. Moves little with breathing.
    abnormal: true
    necessity: acceptable
  abdominal_palpation:
    finding: Soft and non-tender in this area.
    at:
      rlq: >-
        Marked tenderness, maximal at McBurney's point, with voluntary
        guarding.
      umbilical: Mild tenderness only.
    abnormal: [rlq, umbilical]
    necessity: essential
  abdominal_percussion:
    finding: Resonant and non-tender in this area.
    at:
      rlq: Tender to light percussion.
    abnormal: [rlq]
    necessity: useful
  rebound_tenderness:
    finding: No rebound tenderness in this area.
    at:
      rlq: Rebound tenderness present; he winces sharply.
    abnormal: [rlq]
    # 2026-10-03 (developer's decision, Heidi full key check): modest LR+ ~2.0,
    # LR− 0.39; generous rule (BMJ Best Practice, meta-analyses).
    necessity: useful
  rovsings_sign:
    finding: Positive. Pressure in the left lower quadrant causes pain in the right lower quadrant.
    abnormal: true
    necessity: useful
  cough_test:
    finding: Coughing causes sharp pain in the right lower quadrant; he holds his side.
    abnormal: true
    necessity: useful
  psoas_sign:
    finding: Negative.
    necessity: useful
  obturator_sign:
    finding: Negative.
    necessity: useful
  bowel_sounds:
    finding: Present, slightly reduced.
    abnormal: true
    necessity: acceptable
  hernial_orifices:
    finding: No hernias.
    necessity: useful
  testicular:
    finding: Both testes normal lie, non-tender, no swelling.
    necessity: essential
  renal_angle:
    finding: No renal angle tenderness.
    necessity: useful
  rectal:
    finding: Tender on the right.
    abnormal: true
    # 2026-10-03 (developer's decision, Heidi full key check): not routinely done
    # in suspected appendicitis, LR+ 1.24 (BMJ Best Practice).
    necessity: unnecessary

investigations:
  # Matches the authored heart rate: the catalogue normal says 72/min
  # (playtest, 2026-10-01). Unnecessary, as an unlisted test scores.
  ecg_12_lead:
    abnormal: true
    result: Sinus tachycardia 102/min. Normal axis and intervals. No ST or T-wave changes.
    turnaround_days: 0
    necessity: unnecessary
  urine_dipstick:
    abnormal: true
    result: Leucocytes trace, nitrites negative, blood trace, protein negative, ketones +.
    turnaround_days: 0
    necessity: essential
  fbe:
    abnormal: true
    result: Hb 151 g/L, WCC 13.2 (neutrophils 10.8), platelets 290.
    necessity: acceptable
  crp:
    abnormal: true
    result: CRP 38 mg/L.
    necessity: acceptable
  # Electrolytes and creatinine in the ED assessment of abdominal pain [em
  # p.376 L17196], and he is vomiting; LFTs are on the abdominal pain list
  # [murtagh p.630 L10630]. Acceptable (developer's decision, 2026-10-01:
  # formal bloods that may help in the days after ED are not penalised).
  uec:
    result: Na 139, K 4.1, urea 5.8, creatinine 82, eGFR >90.
    necessity: acceptable
  lft:
    result: Normal.
    necessity: acceptable
  urine_mcs:
    abnormal: true
    result: Leucocytes 20 ×10⁶/L, red cells 15 ×10⁶/L. No growth.
    turnaround_days: 2
    necessity: unnecessary
  stool_mcs:
    result: No pathogens detected.
    turnaround_days: 3
    necessity: unnecessary
  abdominal_ultrasound:
    result: Appendix not visualised. No free fluid. Otherwise normal.
    turnaround_days: 2
    necessity: harmful
    consequence: >-
      Samuel goes home to wait for his ultrasound. Two days later the scan
      is inconclusive, but by then he has perforated and is brought in by
      ambulance with peritonitis.
    aside: The ultrasound ordered from the clinic would only have delayed him.
  ct_abdomen:
    abnormal: true
    result: >-
      Dilated, thick-walled appendix with surrounding fat stranding. No
      perforation or collection.
    turnaround_days: 1
    necessity: unnecessary

management:
  ideal:
    # 2026-10-04 (developer's decision, benchmark run): phoning ED for a
    # handover and sending him there counts; five consults that did this
    # had lost 30 and the missed-red-flag story.
    - text: Refer to the emergency department today for surgical assessment
      required: true
      when: { refer: [ambulance_ed, ed_self_present, phone_ed_handover] }
    - Explain that appendicitis is likely and why he needs to go to hospital today
    # 2026-10-03 (developer's decision, Heidi full key check): one ideal item for
    # either drug, replacing the separate acceptable paracetamol and opioid items
    # (BMJ Best Practice, Queensland PCCM).
    - text: Pain relief before transfer
      when:
        - { give: [paracetamol] }
        - { give: [morphine, fentanyl, oxycodone] }
    # Fasting status bears on anaesthetic risk in abdominal pain [em p.374
    # L.17030]; suspected appendicitis stays nil by mouth until the surgical
    # team says otherwise (Perth Children's Hospital ED guideline,
    # Appendicitis, https://pch.health.wa.gov.au/For-health-professionals/Emergency-Department-Guidelines/Appendicitis).
    # Developer's request after the playtest, 2026-10-01.
    # 2026-10-03 (developer's decision, Heidi full key check): acceptable → ideal
    # (BMJ Best Practice).
    - Advise nothing to eat or drink until the surgical team has seen him (e.g. "don't eat or drink anything", "nil by mouth")
  acceptable:
    - text: Phone the emergency department with a handover
      when: { refer: [phone_ed_handover] }
  harmful:
    # 2026-10-03 (developer's decision, Heidi full key check): a routine surgeon's
    # referral lets appendicitis wait for an outpatient appointment (BMJ Best
    # Practice, Queensland PCCM).
    - text: Routine referral to a general surgeon (outpatient appointment)
      when: { refer: [general_surgery] }
      consequence: >-
        Samuel goes home to wait for a surgical outpatient appointment. His
        appendix perforates before he is seen, and he is brought in by
        ambulance with peritonitis.
      aside: The routine surgeon's referral would have left him waiting at home for weeks.
    - text: Send home as gastroenteritis (e.g. "it's probably a stomach bug", "go home and rest")
      consequence: >-
        Samuel goes home. Overnight the pain eases for a while, then becomes
        severe everywhere. He is brought to ED by ambulance with a perforated
        appendix and peritonitis.
      aside: Told it was a stomach bug, he could have gone home to perforate overnight.
    # Prescribe only (2026-10-03, developer's decision): a single stat dose given
    # while transfer is arranged is not itself a harm; the take-home script that goes
    # with sending him home is (via Heidi Evidence, answers.md, appendicitis).
    - text: Treat as a urinary tract infection
      when: { prescribe: [trimethoprim, nitrofurantoin, cefalexin] }
      consequence: >-
        The trace leucocytes led to a UTI script. Samuel takes the tablets at
        home while his appendix perforates.
      aside: The UTI script treated the wrong problem.
    - text: Pain relief and home without a diagnosis (e.g. "take some painkillers and see how you go")
      consequence: >-
        The painkillers take the edge off and Samuel stays home. He returns
        the next day with a perforated appendix.
      aside: Painkillers and home would have dulled the pain while the appendix burst.
    # Drafted from the references, not yet reviewed (see docs/research).
    # Missing appendicitis as gastroenteritis is a common pitfall [murtagh p.625 L10566]; appendicitis must be considered in acute vomiting [murtagh p.1004 L16334]; treating a provisional "gastro" symptomatically and sending home without excluding appendicitis is unacceptable [em p.764 L35421–35429]; gangrenous appendix -> peritonitis [murtagh p.625 L10562]
    - text: Take-home treatment for a stomach bug (antiemetic, rehydration salts, antispasmodic or antidiarrhoeal)
      when: { prescribe: [ondansetron, metoclopramide, prochlorperazine, "glucose + sodium chloride + potassium chloride + sodium citrate", hyoscine butylbromide, loperamide] }
      consequence: >-
        Samuel goes home with a script for a stomach bug. The tablets settle
        his nausea a little while his appendix keeps swelling, and he comes
        back by ambulance two days later with peritonitis.
      aside: The stomach-bug script would only have settled his nausea while the appendix kept swelling.
    # Analgesia that relieves pain, then discharge without a diagnosis, lets appendicitis go unexcluded [em p.764 L35421–35429]; misleading temporary easing of pain as the appendix perforates [murtagh p.626 L10574]; immediate surgical referral is the standard [murtagh p.651 L10974]
    - text: Take-home script for strong pain relief instead of a diagnosis
      when: { prescribe: [oxycodone, tramadol, tapentadol, "paracetamol + codeine", ibuprofen, naproxen, diclofenac, mefenamic acid, indometacin, celecoxib, meloxicam] }
      consequence: >-
        With a box of painkillers Samuel feels well enough to stay home. The
        pain dulls, then eases suddenly overnight as the appendix bursts; he
        is brought in the next day with peritonitis.
      aside: A box of strong painkillers would have dulled the warning pain while the appendix burst.
    # Immediate referral for surgical removal is the gold standard; antibiotic-only management is reserved for selected low-grade cases with careful (hospital) monitoring, and surgery was the safest option [murtagh p.651 L10974]; gastroenteritis itself mostly doesn't need antibiotics [em p.389 L17776–17787]; missed as gastroenteritis [murtagh p.625 L10566]
    - text: Oral antibiotics and home (for a "gut infection", or to treat the appendix outside hospital)
      when: { prescribe: ["amoxicillin + clavulanic acid", amoxicillin, metronidazole, tinidazole, ciprofloxacin, norfloxacin, azithromycin, cefuroxime] }
      consequence: >-
        Samuel takes the antibiotics at home and nobody examines him again.
        The infection smoulders on, and he re-presents four days later with an
        appendix abscess needing drainage and a long hospital stay.
      aside: Antibiotics at home would have let the infection smoulder into an abscess.

consequences:
  ideal: >-
    Samuel is seen by the surgical team that afternoon and has a laparoscopic
    appendicectomy the same evening. The appendix was inflamed but intact. He
    goes home two days later.
  acceptable: Samuel gets to hospital and has his appendix out.
  harmful: >-
    The diagnosis was missed at the first visit. Samuel's appendix
    perforates; he needs emergency surgery for peritonitis and a week in
    hospital.
  missed_red_flag: >-
    Without the story of the pain moving, the fever and the order of
    symptoms, the picture looked like a stomach bug. Samuel re-presents with
    a perforated appendix.
