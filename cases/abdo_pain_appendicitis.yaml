# Pilot case — drafted by Claude from the developer's reference texts.
# NOT clinically reviewed. Source citations are in ground_truth.notes.
id: abdo_pain_appendicitis
status: draft
title: A stomach bug
difficulty: 2
presenting_complaint: Tummy pain
condition_description: >-
  Tummy pain since last night. Probably a stomach bug, but it's not going away.

booked_urgent: false

patient:
  name: Samuel Okafor
  age: 24
  sex: M
  occupation: Apprentice electrician
  persona:
    personality: >-
      Easy-going and a bit stoic. Doesn't like fuss and would rather be at
      work. Answers questions plainly, and plays things down.
    health_literacy: medium
    emotional_state: Uncomfortable and keeping still; mildly embarrassed to be here for a tummy ache.
    verbosity: terse
    conceals: []
  # How he is drawn; cosmetic only, never a finding.
  appearance:
    build: slim
    skin: dark
    hair: black
    hair_length: short
    eyes: brown
    facial_hair: none

record:
  allergies: []
  conditions: []
  medications: []

consult_start: "11:40"

ground_truth:
  diagnosis: appendicitis
  acceptable_diagnoses: []
  sinister: true
  differentials: [gastroenteritis, mesenteric_adenitis, nonspecific_abdominal_pain, renal_colic, crohns_disease, uti]
  # 2026-10-03 (developer's decision, Heidi full key check): strangulated hernia is a
  # can't-miss cause of lower abdominal pain in men (CARPA, NSW ACI).
  sinister_diagnoses: [appendicitis, testicular_torsion, perforated_viscus, strangulated_hernia]
  notes: >-
    Classic anterior appendicitis booked as "a stomach bug": tests whether
    the player elicits the pain's migration and the order of symptoms,
    examines the right lower quadrant and the testes, and refers to hospital
    rather than reassuring or waiting on tests. Male patient so the
    gynaecological differentials don't apply; testicular torsion is the
    can't-miss alternative. Sources: presentation, migration, symptom order
    [murtagh p.648 L.10924-10926; murtagh p.633 L.10688; em p.406
    L.18452-18453]; pain before vomiting favours surgical cause [em p.375
    L.17101]; low-grade fever and mild tachycardia [em p.406 L.18453,
    L.18456]; McBurney tenderness and guarding [murtagh p.650 L.10937-10941;
    talley p.300 L.12351]; Rovsing's, psoas, obturator [murtagh p.650
    L.10945-10951; em p.406 L.18460-18462]; percussion tenderness kinder
    than rebound [talley p.298 L.12151]; cough test [em p.376 L.17174];
    rectal exam of little added value [em p.406 L.18463; talley p.300
    L.12321]; testes must be examined [murtagh p.626 L.10577]; urinalysis
    in all, may show trace leucocytes/blood [em p.406 L.18473; em p.376
    L.17197]; normal WCC/CRP don't exclude, reliance delays treatment [em
    p.406 L.18475-18476]; ultrasound rules in, not out [em p.407 L.18483];
    plain imaging unhelpful [em p.406 L.18478]; immediate surgical referral
    [murtagh p.651 L.10974]; early opioid analgesia doesn't mask signs [em
    p.407 L.18547; em p.378 L.17254]; missed as gastroenteritis or UTI
    [murtagh p.625 L.10566; p.626 L.10576]; analgesia and discharge without
    a diagnosis unacceptable [em p.764 L.35421]; complications [em p.405
    L.18442; murtagh p.675 L.11336]. Not in sources (developer to decide):
    mode of transport, nil by mouth, GP antibiotics, laxatives as a harm.

history:
  - id: pain_site_now
    topic: Where the pain is now
    answer: Down here on the right side, low down.
    volunteered: true
    importance: essential
  - id: pain_onset
    topic: When the pain started
    answer: Last night, about ten o'clock. So maybe fourteen hours.
    volunteered: false
    open_question: true
    importance: essential
  - id: pain_migration
    topic: Where the pain started and whether it has moved
    answer: >-
      It actually started around my belly button. It moved down to the right
      sometime overnight.
    volunteered: false
    importance: red_flag
  - id: pain_character
    topic: Whether the pain is constant or comes and goes
    answer: It's there all the time now. At first it sort of came and went.
    volunteered: false
    open_question: true
    importance: essential
  - id: pain_severity
    topic: How bad the pain is
    answer: Maybe a seven out of ten. I'm not one to complain.
    volunteered: false
    open_question: true
    importance: essential
  # 2026-10-03 (developer's decision, Heidi full key check): pain on coughing
  # (peritonism) is a red flag for urgent consult (CARPA).
  - id: movement_pain
    topic: Whether moving, walking or coughing makes it worse
    answer: >-
      Yeah, walking hurts. Every bump in the car on the way here was awful,
      and coughing is the worst.
    volunteered: false
    importance: red_flag
  - id: anorexia
    topic: Appetite
    answer: I couldn't face breakfast. Not hungry at all, which isn't like me.
    volunteered: false
    importance: essential
    covers: [other_appetite]
  - id: nausea_vomiting
    topic: Nausea or vomiting
    answer: Felt sick since the early hours, and I threw up once this morning.
    volunteered: false
    importance: essential
  - id: vomiting_order
    topic: Whether the pain or the vomiting came first
    answer: The pain came first. The sickness came a few hours later.
    volunteered: false
    importance: essential
  - id: fever
    topic: Fever, sweats or chills
    answer: I felt hot and a bit shivery last night.
    volunteered: false
    importance: red_flag
    covers: [other_sweats]
  - id: testicular_pain
    topic: Pain or swelling in the testicles
    answer: No, nothing down there.
    volunteered: false
    importance: red_flag
    absent: true
  # 2026-10-03 (developer's decision, Heidi full key check): checks for a hernia, a
  # can't-miss cause of lower abdominal pain in men (CARPA, NSW ACI).
  - id: groin_lump
    topic: A lump or bulge in the groin
    answer: No, no lumps down there.
    volunteered: false
    importance: essential
    covers: [other_swelling]
    absent: true
  - id: faint
    topic: Fainting or light-headedness
    answer: No, I haven't fainted or felt faint.
    volunteered: false
    importance: red_flag
    absent: true
  - id: urinary_symptoms
    topic: Pain or frequency passing urine
    answer: No, weeing is normal.
    volunteered: false
    importance: essential
    covers: [other_urine]
    absent: true
  - id: diarrhoea
